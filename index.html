<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Bộ Plugin Minecraft SMP</title>
    <!-- Nhúng thư viện JSZip để nén file trực tiếp trên trình duyệt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #2b2b3d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 { text-align: center; color: #4ecca3; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #1e1e2f;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .checkbox-group {
            background: #1e1e2f;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .checkbox-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .checkbox-group input { margin-right: 10px; }
        button {
            background-color: #4ecca3;
            color: #1e1e2f;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #45b08c; }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Tạo Plugin Minecraft SMP</h2>
    <form id="pluginForm">
        <div class="form-group">
            <label for="serverName">Tên Server SMP của bạn:</label>
            <input type="text" id="serverName" name="serverName" placeholder="Ví dụ: MySurvivalSMP" required>
        </div>

        <div class="form-group">
            <label>Chọn các tính năng / plugin tích hợp:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="plugins" value="smp-essentials" checked> EssentialsX (Lệnh cơ bản: /home, /spawn, /warp)</label>
                <label><input type="checkbox" name="plugins" value="economy"> Hệ thống kinh tế (Vault + Shop)</label>
                <label><input type="checkbox" name="plugins" value="land-claim"> Chống phá hoại / Claim đất (GriefPrevention)</label>
            </div>
        </div>

        <button type="submit">Đóng gói và Tải File .zip</button>
    </form>
</div>

<script>
    document.getElementById('pluginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const serverName = document.getElementById('serverName').value || 'Minecraft_SMP';
        const checkboxes = document.querySelectorAll('input[name="plugins"]:checked');
        const plugins = Array.from(checkboxes).map(cb => cb.value);

        const submitBtn = e.target.querySelector('button');
        submitBtn.textContent = 'Đang đóng gói file .zip...';
        submitBtn.disabled = true;

        try {
            // Khởi tạo đối tượng JSZip
            const zip = new JSZip();

            // Thêm file cấu hình dựa trên lựa chọn
            if (plugins.includes('smp-essentials')) {
                zip.file("Essentials/config.yml", "# Cấu hình cơ bản cho SMP Essentials\nspawn-protection: 0\n");
            }
            if (plugins.includes('economy')) {
                zip.file("Vault/config.yml", "# Cấu hình kinh tế (Shop/Money)\nstarting-balance: 1000\n");
            }
            if (plugins.includes('land-claim')) {
                zip.file("GriefPrevention/config.yml", "# Bảo vệ đất đai cho SMP\nmax-claims: 5\n");
            }

            // Thêm file hướng dẫn
            const readmeText = `=== HƯỚNG DẪN SỬ DỤNG BỘ PLUGIN SMP ===\nServer: ${serverName}\n\n- Giải nén toàn bộ thư mục này vào thư mục gốc của server (nơi chứa thư mục plugins).\n- Khởi động lại server để áp dụng.`;
            zip.file("README_HUONG_DAN.txt", readmeText);

            // Tạo file .zip và kích hoạt tải xuống
            const content = await zip.generateAsync({ type: "blob" });
            const url = window.URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SMP_Config_${serverName.replace(/\s+/g, '_')}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            
            submitBtn.textContent = 'Đóng gói thành công!';
            setTimeout(() => {
                submitBtn.textContent = 'Đóng gói và Tải File .zip';
                submitBtn.disabled = false;
            }, 2000);

        } catch (error) {
            console.error(error);
            alert('Có lỗi xảy ra khi tạo file zip.');
            submitBtn.textContent = 'Đóng gói và Tải File .zip';
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
